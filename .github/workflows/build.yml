name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dpkg-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller onedir)
        run: pyinstaller --noconfirm marsad.spec

      - name: Package .deb
        run: bash packaging/linux/build_deb.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: marsad-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb

  windows:
    name: Windows (NSIS + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from tag
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build onedir (for installer)
        run: pyinstaller --noconfirm marsad.spec

      - name: Build onefile (portable)
        env:
          MARSAD_ONEFILE: "1"
        run: |
          pyinstaller --noconfirm --distpath dist/portable marsad.spec
          copy dist\portable\marsad.exe dist\marsad-${{ steps.v.outputs.version }}-portable.exe

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" -DVERSION=${{ steps.v.outputs.version }} packaging\windows\marsad.nsi'

      - uses: actions/upload-artifact@v4
        with:
          name: marsad-windows
          path: |
            dist/marsad-setup-*.exe
            dist/marsad-*-portable.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/marsad-setup-*.exe
            dist/marsad-*-portable.exe
